<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CyberDrill Desk – Incident Simulation</title>
<style>
:root{--bg:#f2f3f5;--card:#fff;--tx:#1b1f24;--mut:#667080;--bd:#d8dce2;--ac:#1d4ed8;--acx:#fff;--red:#b42318;--amb:#b54708;--grn:#067647;--sub:#f7f8fa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1a1e24;--tx:#e6e9ee;--mut:#97a1af;--bd:#2c323b;--ac:#6ea0ff;--acx:#0b1220;--red:#ff8b7e;--amb:#fdb022;--grn:#47cd89;--sub:#151920}}
:root[data-theme="dark"]{--bg:#111418;--card:#1a1e24;--tx:#e6e9ee;--mut:#97a1af;--bd:#2c323b;--ac:#6ea0ff;--acx:#0b1220;--red:#ff8b7e;--amb:#fdb022;--grn:#47cd89;--sub:#151920}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1060px;margin:0 auto;padding:14px}
h1{font-size:1.35rem;margin:.2em 0}h2{font-size:1.02rem;margin:0 0 8px}
.sub{color:var(--mut);margin:0 0 12px}.mut{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:14px;margin:12px 0}
label{display:block;font-weight:600;margin:10px 0 4px;font-size:.85rem}
input,select,textarea{width:100%;box-sizing:border-box;padding:9px;border:1px solid var(--bd);border-radius:6px;background:var(--sub);color:var(--tx);font:inherit}
textarea{min-height:76px}
.btn{margin-top:10px;padding:9px 16px;border:0;border-radius:6px;background:var(--ac);color:var(--acx);font:inherit;font-weight:600;cursor:pointer}
.btn.alt{background:transparent;color:var(--tx);border:1px solid var(--bd);margin-left:6px}
.top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 14px}
.top .sp{flex:1}.pill{padding:2px 9px;border-radius:99px;font-size:.78rem;font-weight:700;border:1px solid var(--bd)}
.p1{background:var(--red);color:#fff;border-color:var(--red)}.clk{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.05rem}
.cols{display:grid;grid-template-columns:3fr 2fr;gap:12px}@media(max-width:820px){.cols{grid-template-columns:1fr}}
.it{border:1px solid var(--bd);border-left:4px solid var(--mut);border-radius:6px;padding:9px 11px;margin:8px 0;background:var(--sub);animation:in .3s}
.it.siem{border-left-color:var(--red)}.it.reg{border-left-color:var(--amb)}.it.email{border-left-color:var(--ac)}.it.social{border-left-color:var(--amb)}.it.call{border-left-color:var(--grn)}
.it .hd{display:flex;gap:8px;font-size:.78rem;color:var(--mut);flex-wrap:wrap}.it .hd b{color:var(--tx)}.it p{margin:3px 0 0}
@keyframes in{from{opacity:0}}
.dec{border-bottom:1px solid var(--bd);padding:7px 0;font-size:.9rem}.dec small{color:var(--mut)}
.fac{background:var(--sub);border:1px dashed var(--bd);border-radius:8px;padding:12px;margin-top:12px}
.fac label{font-weight:400;display:flex;gap:8px;margin:6px 0}.fac input{width:auto}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.88rem}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd);vertical-align:top}
.big{font-size:2rem;font-weight:700;margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
@media print{.noprint{display:none!important}body{background:#fff;color:#000}}
</style></head>
<body><main id="app"></main>
<script>
var AR=["Detection and containment","Crisis governance","Customer communication","Regulators and stakeholders","Recovery and third parties"];
var TY={siem:"SIEM alert",chat:"Teams",email:"Email",call:"Phone",social:"Social media",reg:"Regulator"};
var ST=["Investigating","Containment in progress","Major incident – customer impact","Regulatory engagement","Recovery"];
var P=[
{t:"09:05",n:"Detection and triage",a:[
[0,"siem","Splunk ES · Notable (High)","Mass file modification on SW-PAY-01 and SW-PAY-02. 4,812 renames/min. Rule: ransomware_behaviour_v3. Confidence: medium."],
[40,"chat","L2 Analyst · #soc-ops","seeing .locked on a few shares. could be the backup job tho? still checking"],
[120,"chat","Head of IT","Switch latency is climbing. Are we taking these hosts off the network or not? I need a call."]],
x:[["Incident declared, the response plan activated and an incident commander named",["chat","SOC · L2 Analyst","Encryption is now on SW-PAY-03 and the settlement DB host. It spread while we were still assessing."]],
["Affected hosts isolated while preserving forensic evidence",["chat","Head of IT","Someone rebooted two hosts to “clear it”. Memory and some logs are gone."]]]},
{t:"09:40",n:"Crisis management",a:[
[0,"email","unknown@proton.me · Subject: YOUR DATA","All your files are encrypted. We hold 180 GB of customer and merchant data. Pay 12 BTC within 48 hours or it will be published."],
[30,"call","Contact Centre Lead (phone)","Calls are up 4x in 15 minutes. Customers say QR payments are declined. Agents have nothing to tell them."],
[90,"chat","CFO","Merchants are asking about settlement cut-off. Who is talking to them?"]],
x:[["Crisis management team convened with clear roles (command, comms, legal, operations)",["chat","CEO","I’ve had three people give me three different updates. Who is running this?"]],
["Legal counsel engaged, evidence preserved and the ransom question referred to the board",["chat","Legal","Logs on two hosts were overwritten during a rebuild attempt. That complicates things."]],
["Alternative processing and merchant settlement options considered",["chat","CFO","Two large merchants are threatening to move volume to another provider today."]]]},
{t:"10:30",n:"Public and customer communication",a:[
[0,"social","X · @amirah_k","@brand payments down again?? stuck at checkout since 10. is this a hack"],
[20,"call","Reporter, The Daily (voicemail)","Hi, we’re hearing you’ve been hit by ransomware. Can you confirm? We’re filing at 1 pm."],
[50,"chat","Contact Centre Lead","Agents are improvising. A few are saying scheduled maintenance. We need approved lines now."]],
x:[["Approved holding statement issued and the app or status page updated",["social","X · @fintechwatch","Screenshot of a chat agent saying “maintenance”. Thread asking if the company is lying. #PaymentsDown trending."]],
["One spokesperson and a contact centre script in place",["call","Reporter, The Daily","A source tells us customer data was stolen. We’re running it at 1 pm unless you comment."]]]},
{t:"11:15",n:"Regulators and stakeholders",a:[
[0,"chat","Compliance","Do we have to notify? We don’t yet know if data left the environment. Policy says “significant incidents”."],
[30,"email","Legal · Internal","Note: the affected hosts support regulated payment services. The notification clock arguably started at detection."],
[70,"chat","CEO","What are the downsides of telling the regulator now? Can we wait for forensics?"]],
x:[["Regulator notification decided with initial facts and an update cadence",["reg","Regulator · Supervision","We’ve seen media reports of your outage. Please call us immediately."]],
["Other parties considered: scheme partners, law enforcement, cyber insurer, data protection",["email","Scheme partner · Risk","We’ve detected abnormal traffic from your endpoints and are limiting your access pending review."]]]},
{t:"13:00",n:"Recovery",a:[
[0,"email","Cloud Provider · TAM","Last clean snapshot is 18 hours old (yesterday 19:00). Restore tooling is ready. Snapshot integrity has not been validated by your team."],
[30,"email","Attacker","Price is now 18 BTC. The payment portal closes in 6 hours. Stop wasting our time."],
[70,"chat","Head of IT","I can restore to production in about 90 minutes. Need go or no-go. I’m also not sure persistence has been cleaned."]],
x:[["Restore decision based on validated backups, phased recovery and reconciliation of the 18-hour gap",["chat","Head of IT","Restored environment re-infected within 20 minutes. Rolling back."]],
["Ransom decision documented with board and legal approval",null]]}
];
var S={v:0,n:"",ty:"E-money issuer",f:"",d:new Date().toISOString().slice(0,10),p:0,t0:0,chk:{},dec:[],cons:{},fac:false,id:"INC-"+(2600+Math.floor(Math.random()*400))};
var TM=[],$=function(s){return document.querySelector(s)},E=function(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
function sec(t){var a=t.split(":");return +a[0]*3600+ +a[1]*60}
function fmt(s){s=Math.floor(s);return[Math.floor(s/3600)%24,Math.floor(s/60)%60,s%60].map(function(x){return String(x).padStart(2,"0")}).join(":")}
function item(it,base){return '<div class="it '+it[1]+'"><div class="hd"><b>'+TY[it[1]]+'</b><span>'+E(it[2])+'</span><span style="margin-left:auto">'+fmt(sec(base)+it[0])+'</span></div><p>'+E(it[3])+'</p></div>'}
function setup(){return '<h1>CyberDrill Desk</h1><p class="sub">Incident simulation for tabletop and crisis management exercises</p><div class="card"><h2>Scenario: ransomware on the payment platform</h2><p>The team works from the information a real incident would produce: alerts, chat messages, calls, emails, social posts. There are no multiple-choice answers. The team discusses, the scribe logs decisions, and the facilitator assesses against expected actions. Weak or missed actions come back as realistic consequences in later phases.</p><label>Organisation</label><input value="'+E(S.n)+'" oninput="S.n=this.value"><label>Entity type</label><select onchange="S.ty=this.value">'+["E-money issuer","Merchant acquirer","Bank","Insurer / takaful","Other"].map(function(x){return"<option"+(x==S.ty?" selected":"")+">"+x+"</option>"}).join("")+'</select><label>Facilitator</label><input value="'+E(S.f)+'" oninput="S.f=this.value"><label>Date</label><input type="date" value="'+S.d+'" oninput="S.d=this.value"><button class="btn" onclick="start()">Begin exercise</button></div>'}
function decl(){var h="";S.dec.forEach(function(d){h='<div class="dec"><b>'+fmt(sec(P[d.p].t)+d.s)+'</b> · '+E(d.own)+'<br>'+E(d.txt)+'</div>'+h});return h||'<p class="mut">No decisions logged yet.</p>'}
function drill(){var q=P[S.p],R=["Incident Commander","CISO","Head of IT","Operational Risk","Compliance","Legal","Communications","CEO","CFO"];
var h='<div class="top"><b>'+S.id+'</b><span class="pill p1">P1</span><span class="pill">'+ST[S.p]+'</span><span class="mut">Phase '+(S.p+1)+' of '+P.length+' · '+q.n+'</span><span class="sp"></span><span class="mut noprint" style="font-size:.78rem">EXERCISE – not a real incident</span><span class="clk" id="clk">'+q.t+':00</span></div>';
h+='<div class="cols"><div class="card"><h2>Incoming information</h2><div id="feed"></div></div><div><div class="card"><h2>Decision log</h2><label>Decision owner</label><select id="own">'+R.map(function(x){return"<option>"+x+"</option>"}).join("")+'</select><label>Decision and rationale</label><textarea id="dt" placeholder="What has the team decided, and why?"></textarea><button class="btn" onclick="addDec()">Log decision</button><div id="dl" style="margin-top:10px">'+decl()+'</div></div></div></div>';
h+='<p class="noprint"><button class="btn" onclick="endPhase()">'+(S.p<P.length-1?"Close phase and continue":"End exercise and view report")+'</button> <label style="display:inline-flex;gap:6px;margin-left:10px;font-weight:400"><input type="checkbox" style="width:auto" '+(S.fac?"checked":"")+' onchange="S.fac=this.checked;$(\'#fac\').style.display=this.checked?\'block\':\'none\'"> Facilitator view</label></p>';
h+='<div class="fac noprint" id="fac" style="display:'+(S.fac?"block":"none")+'"><b>Facilitator only: expected actions</b><p class="mut" style="margin:2px 0 6px">Tick what the team actually did. Anything unticked returns as a consequence in the next phase.</p>'+q.x.map(function(x,k){var key=S.p+"_"+k;return'<label><input type="checkbox" '+(S.chk[key]?"checked":"")+' onchange="S.chk[\''+key+'\']=this.checked">'+x[0]+'</label>'}).join("")+'</div>';
return h}
function live(){TM.forEach(clearTimeout);TM=[];var f=$("#feed");if(!f)return;var q=P[S.p],ms=q.a.concat((S.cons[S.p]||[]).map(function(c,i){return[10+i*25].concat(c)}));ms.sort(function(a,b){return a[0]-b[0]});var el=(Date.now()-S.t0)/1000;
f.innerHTML=ms.filter(function(m){return m[0]<=el}).reverse().map(function(m){return item(m,q.t)}).join("");
ms.filter(function(m){return m[0]>el}).forEach(function(m){TM.push(setTimeout(function(){var g=$("#feed");if(g)g.insertAdjacentHTML("afterbegin",item(m,q.t))},(m[0]-el)*1000))})}
function tick(){var c=$("#clk");if(S.v==1&&c)c.textContent=fmt(sec(P[S.p].t)+(Date.now()-S.t0)/1000)}
function addDec(){var t=$("#dt").value.trim();if(!t)return;S.dec.push({p:S.p,s:Math.floor((Date.now()-S.t0)/1000),own:$("#own").value,txt:t});$("#dt").value="";$("#dl").innerHTML=decl()}
function endPhase(){if(S.p<P.length-1){var n=S.p+1;S.cons[n]=S.cons[n]||[];P[S.p].x.forEach(function(x,k){if(!S.chk[S.p+"_"+k]&&x[1])S.cons[n].push(x[1])});S.p=n;S.t0=Date.now()}else{S.v=2}render()}
function start(){S.v=1;S.p=0;S.chk={};S.dec=[];S.cons={};S.t0=Date.now();render()}
function report(){var tot=0,ok=0,rows="",gaps="",nc=0;
P.forEach(function(q,p){var c=0;q.x.forEach(function(x,k){tot++;if(S.chk[p+"_"+k]){ok++;c++}else gaps+='<div class="dec"><b>'+AR[p]+'</b><br>'+x[0]+'<div class="row" style="margin-top:6px"><input placeholder="Action owner" oninput="S.gw=1"><input type="date"></div></div>'});
var fd=S.dec.filter(function(d){return d.p==p})[0];rows+='<tr><td>'+AR[p]+'</td><td>'+c+' of '+q.x.length+'</td><td>'+(fd?fd.s+"s":"No decision logged")+'</td></tr>'});
for(var k in S.cons)nc+=S.cons[k].length;
var pc=Math.round(ok/tot*100);
var h='<h1>Exercise report</h1><p class="sub">'+E(S.n||"Organisation")+' · '+E(S.ty)+' · '+S.d+' · Facilitator: '+E(S.f||"–")+' · '+S.id+'</p><div class="card"><p class="big">'+pc+'%</p><p>of expected actions completed ('+ok+' of '+tot+') · '+S.dec.length+' decisions logged · '+nc+' consequence'+(nc==1?"":"s")+' triggered by missed actions</p></div>';
h+='<div class="card"><h2>Results by phase</h2><div class="tw"><table><tr><th>Phase</th><th>Expected actions met</th><th>Time to first logged decision</th></tr>'+rows+'</table></div></div>';
h+='<div class="card"><h2>Decision log</h2>'+(S.dec.length?S.dec.map(function(d){return'<div class="dec"><b>'+fmt(sec(P[d.p].t)+d.s)+'</b> · '+AR[d.p]+' · '+E(d.own)+'<br>'+E(d.txt)+'</div>'}).join(""):"<p class='mut'>No decisions were logged.</p>")+'</div>';
h+='<div class="card"><h2>Gaps and remediation</h2>'+(gaps||"<p class='mut'>All expected actions were met.</p>")+'</div>';
h+='<p class="noprint"><button class="btn" onclick="window.print()">Print or save as PDF</button><button class="btn alt" onclick="S.v=0;render()">New exercise</button></p><p class="mut" style="font-size:.8rem">Prototype. Scenario content is illustrative. Map expected actions to your entity’s current RMiT obligations and internal review before using this as regulatory evidence.</p>';return h}
function render(){$("#app").innerHTML=S.v==0?setup():S.v==1?drill():report();if(S.v==1)live();window.scrollTo(0,0)}
setInterval(tick,1000);render();
</script></body></html>
